<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chladni</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#1e1e1e}
    canvas{display:block}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const PI=Math.PI,MIN=0.0005,NUM=8000,V=0.004,LERP=0.005;
const dpr=Math.min(devicePixelRatio||1,2);
let W,H;

const aVals=[-2,-1,1,2];
function rInt(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function rA(){return aVals[Math.floor(Math.random()*4)];}
function newTarget(){return{m:rInt(1,16),n:rInt(1,16),a:rA(),b:rA()};}

let cm=2,cn=3,ca=1,cb=-1;
let tgt=newTarget();

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);
}

const xs=new Float32Array(NUM);
const ys=new Float32Array(NUM);
function init(){
  for(let i=0;i<NUM;i++){xs[i]=Math.random()*.9+.05;ys[i]=Math.random()*.9+.05;}
}
function rand(){return Math.random()*2-1;}

function tick(){
  cm+=(tgt.m-cm)*LERP;
  cn+=(tgt.n-cn)*LERP;
  ca+=(tgt.a-ca)*LERP;
  cb+=(tgt.b-cb)*LERP;

  const pw=W*dpr,ph=H*dpr;
  const id=ctx.getImageData(0,0,pw,ph);
  const d=id.data;
  for(let i=0;i<d.length;i+=4){d[i]=30;d[i+1]=30;d[i+2]=30;d[i+3]=255;}

  for(let i=0;i<NUM;i++){
    let x=xs[i],y=ys[i];
    const eq=ca*Math.sin(PI*cn*x)*Math.sin(PI*cm*y)
             +cb*Math.sin(PI*cm*x)*Math.sin(PI*cn*y);
    let amp=V*Math.abs(eq);
    if(amp<MIN)amp=MIN;
    x+=rand()*amp;
    y+=rand()*amp;
    if(x<0)x=-x; if(x>1)x=2-x;
    if(y<0)y=-y; if(y>1)y=2-y;
    xs[i]=x<0?0:x>1?1:x;
    ys[i]=y<0?0:y>1?1:y;
    const px=Math.round(x*pw);
    const py=Math.round(y*ph);
    if(px>=0&&px<pw&&py>=0&&py<ph){
      const idx=(py*pw+px)*4;
      d[idx]=255;d[idx+1]=255;d[idx+2]=255;d[idx+3]=255;
    }
  }
  ctx.putImageData(id,0,0);
  requestAnimationFrame(tick);
}

window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='chladni-stage') tgt=newTarget();
});

window.addEventListener('resize',function(){ctx.setTransform(1,0,0,1,0,0);resize();});
resize();init();tick();
</script>
</body>
</html>
