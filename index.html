<!DOCTYPE html>
<html lang="en-US">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chladni</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    html,body{width:100%;height:100%;overflow:hidden;background:#1e1e1e}
    canvas{display:block}
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const STAGES=[
  {m:1,n:1,a:-2,b:2},
  {m:3,n:2,a:-2,b:-2},
  {m:3,n:5,a:-2,b:-2},
  {m:8,n:6,a:2,b:-2},
];

const cv=document.getElementById('c');
const ctx=cv.getContext('2d');
const PI=Math.PI,MIN=0.001,NUM=4000,V=0.008;
const dpr=Math.min(devicePixelRatio||1,2);
let W,H;

// current interpolated values
let cm=1,cn=1,ca=-2,cb=2;
// target values
let tm=1,tn=1,ta=-2,tb=2;
const LERP=0.012;

function resize(){
  W=window.innerWidth;H=window.innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;
  cv.style.width=W+'px';cv.style.height=H+'px';
  ctx.scale(dpr,dpr);
}

const xs=new Float32Array(NUM);
const ys=new Float32Array(NUM);

function init(){
  for(let i=0;i<NUM;i++){
    xs[i]=Math.random()*0.9+0.05;
    ys[i]=Math.random()*0.9+0.05;
  }
}

function rand(){return Math.random()*2-1;}

function tick(){
  // lerp current toward target
  cm+=(tm-cm)*LERP;
  cn+=(tn-cn)*LERP;
  ca+=(ta-ca)*LERP;
  cb+=(tb-cb)*LERP;

  ctx.fillStyle='#1e1e1e';
  ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,0.9)';

  for(let i=0;i<NUM;i++){
    let x=xs[i],y=ys[i];
    const eq=ca*Math.sin(PI*cn*x)*Math.sin(PI*cm*y)
             +cb*Math.sin(PI*cm*x)*Math.sin(PI*cn*y);
    let amp=V*Math.abs(eq);
    if(amp<MIN)amp=MIN;
    x+=rand()*amp;
    y+=rand()*amp;
    if(x<0)x=-x; if(x>1)x=2-x;
    if(y<0)y=-y; if(y>1)y=2-y;
    xs[i]=x<0?0:x>1?1:x;
    ys[i]=y<0?0:y>1?1:y;
    ctx.fillRect(x*W-0.8,y*H-0.8,1.6,1.6);
  }
  requestAnimationFrame(tick);
}

window.addEventListener('message',function(e){
  if(e.data&&e.data.type==='chladni-stage'){
    const s=STAGES[Math.min(Math.max(e.data.stage,0),3)];
    tm=s.m;tn=s.n;ta=s.a;tb=s.b;
  }
});

window.addEventListener('resize',function(){
  ctx.setTransform(1,0,0,1,0,0);
  resize();
});

resize();
init();
tick();
</script>
</body>
</html>
